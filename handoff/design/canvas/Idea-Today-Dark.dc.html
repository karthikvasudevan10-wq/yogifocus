<h1 style="margin: 18px 0 0; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1; color: #EEF5E8; text-wrap: balance">Only today.</h1>
<p style="margin: 12px 0 0; font-size: 17px; color: #EEF5E8; text-wrap: pretty">“Do this every day for the rest of your life” is too heavy to carry. So a yogi doesn't carry it. Each morning they ask a single question.</p>
<div style="margin-top: 18px; padding: 20px 22px; border-radius: 22px; background: #FFD21F; color: #14301F; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.25">This is a new day. How will I keep my practice today?</div>
<p style="margin: 14px 0 0; font-size: 15px; color: #A9B8A5; text-wrap: pretty">It is the only thing Yogi Focus will ever ask of you.</p>
