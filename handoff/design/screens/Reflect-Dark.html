<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How did it feel? · Yogi Focus design reference</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>

body{margin:0}
a{color:#8AE264}a:hover{color:#EEF5E8}
button,input{font-family:inherit}
button{cursor:pointer}
@keyframes yf-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes yf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes yf-fall{from{transform:translateY(0)}to{transform:translateY(940px)}}
@keyframes yf-sway{from{transform:translateX(-18px) rotate(-50deg)}to{transform:translateX(18px) rotate(70deg)}}
@keyframes yf-rota{0%,40%{opacity:1}48%,90%{opacity:0}98%,100%{opacity:1}}
@keyframes yf-rotb{0%,40%{opacity:0}48%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes yf-spin{to{transform:rotate(360deg)}}
@keyframes yf-levitate{0%,100%{transform:translateY(4px)}50%{transform:translateY(-9px)}}
@keyframes yf-shadow{0%,100%{transform:scale(1);opacity:0.26}50%{transform:scale(0.74);opacity:0.14}}
@keyframes yf-rise{from{transform:translateY(70px)}to{transform:translateY(0)}}
@keyframes yf-draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes yf-pop{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes yf-open{from{transform:scale(0.15);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes yf-ring{from{transform:scale(0.8);opacity:0.8}to{transform:scale(1.35);opacity:0}}
@keyframes yf-up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes yf-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:0.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
html{background:#050A06}body{display:flex;justify-content:center;padding:24px 0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 28px 34px; display: flex; flex-direction: column; background: #0E1A11; color: #EEF5E8; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.55; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; flex: none"><a href="Today-Dark.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #EEF5E8"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; display: block"><path d="M15 5l-7 7 7 7"></path></svg></a></div>
<h1 style="margin: 6px 0 0; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1; color: #EEF5E8; text-wrap: balance">You practised today.</h1>
<p style="margin: 8px 0 0; font-size: 17px; color: #EEF5E8; text-wrap: pretty">How did it feel? There is no wrong answer.</p>
<div style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px">
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 20px; border: 2px solid #2C3D2E; background: #18271B; color: #EEF5E8; text-align: left"><span style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #FFD21F; color: #14301F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; display: block"><circle cx="6" cy="7" r="1.4"></circle><circle cx="17" cy="5" r="1.4"></circle><circle cx="12" cy="13" r="1.4"></circle><circle cx="5" cy="18" r="1.4"></circle><circle cx="19" cy="16" r="1.4"></circle></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Scattered</span><span style="font-size: 14px; color: #A9B8A5">My mind was everywhere</span></span></button>
<button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 20px; border: 2px solid #8AE264; background: #1C3A21; color: #EEF5E8; text-align: left"><span style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #FFD21F; color: #14301F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; display: block"><path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 16c3-3 6 3 9 0s6 3 9 0"></path></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Steady</span><span style="font-size: 14px; color: #A9B8A5">I stayed with it, mostly</span></span></button>
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 20px; border: 2px solid #2C3D2E; background: #18271B; color: #EEF5E8; text-align: left"><span style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #FFD21F; color: #14301F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; display: block"><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="10"></circle></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Absorbed</span><span style="font-size: 14px; color: #A9B8A5">I lost track of time</span></span></button>
</div>

<div style="margin-top: 14px; padding: 18px 22px; border-radius: 22px; background: #FFD21F; color: #14301F; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; font-size: 20px; line-height: 1.3; animation: yf-up 0.35s ease-out both">Steady is exactly how a practice grows.</div>

<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px"><label for="note" style="font-size: 13px; font-weight: 500; color: #A9B8A5">A note for yourself (optional)</label><input id="note" type="text" value="" placeholder="Anything you noticed" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #A9B8A5; background: #18271B; font-size: 16px; color: #EEF5E8"></div>
<a href="Kept-Dark.html" style="margin-top: auto; flex: none; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 28px; background: #6FD43A; color: #14301F; font-size: 17px; font-weight: 600; text-decoration: none">Done</a>
</div>
</body>
</html>
